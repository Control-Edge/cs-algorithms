name: macOS CI

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Verify CppModel credentials are set
        env:
          CPPMODEL_USERNAME: ${{ secrets.CPPMODEL_USERNAME }}
          CPPMODEL_PASSWORD: ${{ secrets.CPPMODEL_PASSWORD }}
        run: |
          if [ -z "$CPPMODEL_USERNAME" ] || [ -z "$CPPMODEL_PASSWORD" ]; then
            echo "::error::CPPMODEL_USERNAME and CPPMODEL_PASSWORD secrets must be configured for this workflow"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies (CMake, Ninja)
        run: brew install cmake ninja
      - name: Download and extract CppModel libraries
        run: |
          curl -fsSL https://download.cppmodel.com/CppModel-0.9.1-macOS-universal.tar.gz -o cppmodel.tar.gz
          mkdir -p dependencies
          tar -xzf cppmodel.tar.gz -C dependencies --strip-components=1
          rm cppmodel.tar.gz
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel
      - name: Test
        timeout-minutes: 5
        working-directory: build
        env:
          CPPMODEL_USERNAME: ${{ secrets.CPPMODEL_USERNAME }}
          CPPMODEL_PASSWORD: ${{ secrets.CPPMODEL_PASSWORD }}
        run: ctest --output-on-failure