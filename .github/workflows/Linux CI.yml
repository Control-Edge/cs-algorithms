name: Linux CI

on:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci_test_compilers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lib: gcc12
            container: gcc:12
          - lib: gcc16
            container: gcc:16
          - lib: clang21
            container: silkeh/clang:21
    container: ${{ matrix.container }}
    steps:
      - name: Verify CppModel credentials are set
        env:
          CPPMODEL_USERNAME: ${{ secrets.CPPMODEL_USERNAME }}
          CPPMODEL_PASSWORD: ${{ secrets.CPPMODEL_PASSWORD }}
        run: |
          if [ -z "$CPPMODEL_USERNAME" ] || [ -z "$CPPMODEL_PASSWORD" ]; then
            echo "::error::CPPMODEL_USERNAME and CPPMODEL_PASSWORD secrets must be configured for this workflow"
            exit 1
          fi
      - name: Install Git and curl (required by checkout and library download)
        run: apt-get update && apt-get install -y git curl
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install zlib (required by IXWebSocket)
        run: apt-get install -y zlib1g-dev
      - name: Get latest CMake and ninja
        uses: lukka/get-cmake@v3.27.7

      - name: Download and extract CppModel libraries
        run: |
          curl -fsSL https://download.cppmodel.com/CppModel-latest-Linux-${{ matrix.lib }}.tar.gz -o cppmodel.tar.gz
          mkdir -p dependencies
          tar -xzf cppmodel.tar.gz -C dependencies --strip-components=1
          rm cppmodel.tar.gz

      - name: Run CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build --config RelWithDebInfo --target all
      - name: Test
        timeout-minutes: 5
        working-directory: build
        env:
          CPPMODEL_USERNAME: ${{ secrets.CPPMODEL_USERNAME }}
          CPPMODEL_PASSWORD: ${{ secrets.CPPMODEL_PASSWORD }}
        run: ctest --output-on-failure